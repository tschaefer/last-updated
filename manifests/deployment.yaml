---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: last-updated-webhook
  namespace: webhook-system
  labels:
    app.kubernetes.io/name: "last-updated-webhook"
    app.kubernetes.io/instance: "last-updated-webhook"
    app.kubernetes.io/component: "service"
    app.kubernetes.io/version: "v{{VERSION}}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: "last-updated-webhook"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "last-updated-webhook"
        app.kubernetes.io/instance: "last-updated-webhook"
        app.kubernetes.io/component: "service"
        app.kubernetes.io/version: "v{{VERSION}}"
    spec:
      serviceAccountName: last-updated-webhook
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: ghcr.io/tschaefer/last-updated:{{VERSION}}
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /etc/webhook/config.yaml
            - name: TLS_CERTIFICATE_PATH
              value: /etc/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/tls/tls.key
            - name: LOG_LEVEL
              value: info
          ports:
            - containerPort: 8443
              name: webhook
            - containerPort: 9090
              name: metrics
            - containerPort: 8080
              name: health
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTP
              path: /ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
            - name: config
              mountPath: /etc/webhook
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: tls
          secret:
            secretName: last-updated-webhook-tls
        - name: config
          configMap:
            name: last-updated-webhook-config
