---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: last-updated-annotator
  annotations:
    cert-manager.io/inject-ca-from: webhook-system/last-updated-webhook-tls
  labels:
    app.kubernetes.io/name: "last-updated-webhook"
    app.kubernetes.io/instance: "last-updated-webhook"
    app.kubernetes.io/component: "webhook"
    app.kubernetes.io/version: "v{{VERSION}}"
webhooks:
  - name: last-updated.meta.k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    matchPolicy: Equivalent
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        namespace: webhook-system
        name: last-updated-webhook
        path: /mutate
        port: 443
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "statefulsets", "replicasets"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["configmaps", "secrets", "services"]
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        resources: ["networkpolicies"]
