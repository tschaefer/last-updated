---
apiVersion: v1
kind: ConfigMap
metadata:
  name: last-updated-webhook-config
  namespace: webhook-system
  labels:
    app.kubernetes.io/name: "last-updated-webhook"
    app.kubernetes.io/instance: "last-updated-webhook"
    app.kubernetes.io/component: "service"
    app.kubernetes.io/version: "v{{VERSION}}"
data:
  config.yaml: |
    annotationKey: meta.k8s.io/updated-timestamp
    timestampFormat: RFC3339
    updateOnCreate: true
    excludeSubresources: true

    resources:
      - group: apps
        resource: deployments
      - group: apps
        resource: statefulsets
      - group: apps
        resource: replicasets
      - group: ""
        resource: configmaps
      - group: ""
        resource: secrets
      - group: networking.k8s.io
        resource: networkpolicies
      - group: ""
        resource: services

    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
